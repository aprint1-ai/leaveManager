<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인 연차 조회 서비스 - 푸드윈 홀딩스</title>
  
  <!-- CSS 및 아이콘 불러오기 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React 및 Babel 불러오기 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background-color: #f8fafc; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // Firebase 도구 불러오기
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 파이어베이스 설정값
    const firebaseConfig = {
      apiKey: "AIzaSyC4ltCdiOULVX_WsNFO1k54t2lTc69JcFI",
      authDomain: "leavemanager-98009.firebaseapp.com",
      projectId: "leavemanager-98009",
      storageBucket: "leavemanager-98009.firebasestorage.app",
      messagingSenderId: "305739969906",
      appId: "1:305739969906:web:93033e6d43ae30fa92d9eb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const { useState, useEffect, useMemo } = React;

    // 한글 ➔ QWERTY 영문 자판 변환 유틸리티 함수
    function convertHangulToQwerty(text) {
      if (!text) return '';
      const choList = ['r', 'R', 's', 'e', 'E', 'f', 'a', 'q', 'Q', 't', 'T', 'd', 'w', 'W', 'c', 'z', 'x', 'v', 'g'];
      const jungList = ['k', 'o', 'i', 'O', 'j', 'p', 'u', 'P', 'h', 'hk', 'ho', 'hl', 'y', 'n', 'nj', 'np', 'nl', 'b', 'm', 'ml', 'l'];
      const jongList = ['', 'r', 'R', 'rt', 's', 'sw', 'sg', 'e', 'f', 'fr', 'fa', 'fq', 'ft', 'fx', 'fv', 'fg', 'a', 'q', 'qt', 't', 'T', 'd', 'w', 'c', 'z', 'x', 'v', 'g'];

      let result = '';
      for (let i = 0; i < text.length; i++) {
        const code = text.charCodeAt(i);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          const charIndex = code - 0xAC00;
          const choIndex = Math.floor(charIndex / 588);
          const jungIndex = Math.floor((charIndex % 588) / 28);
          const jongIndex = charIndex % 28;
          result += choList[choIndex] + jungList[jungIndex] + jongList[jongIndex];
        } else {
          result += text[i].toLowerCase();
        }
      }
      return result;
    }

    function App() {
      const [user, setUser] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [employees, setEmployees] = useState([]);
      const [managers, setManagers] = useState([]);
      
      const [currentEmp, setCurrentEmp] = useState(() => {
        const saved = sessionStorage.getItem('leave_app_employee_session');
        return saved ? JSON.parse(saved) : null;
      });

      const [loginIdInput, setLoginIdInput] = useState('');
      const [loginPasswordInput, setLoginPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const today = new Date().toISOString().split('T')[0];

      // 1. 익명 인증
      useEffect(() => {
        signInAnonymously(auth).then((userCredential) => {
          setUser(userCredential.user);
        }).catch((err) => {
          console.error("인증 실패:", err);
          setIsLoading(false);
        });
      }, []);

      // 2. 직원 정보 및 관리자 계정 실시간 수신
      useEffect(() => {
        if (!user) return;
        const empRef = collection(db, 'employees');
        const unsubEmp = onSnapshot(empRef, (snapshot) => {
          const emps = [];
          snapshot.forEach(d => emps.push({ id: d.id, ...d.data() }));
          setEmployees(emps);
          setIsLoading(false);
        });

        const mgrRef = collection(db, 'managers');
        const unsubMgr = onSnapshot(mgrRef, (snapshot) => {
          const mgrs = [];
          snapshot.forEach(d => mgrs.push({ id: d.id, ...d.data() }));
          setManagers(mgrs);
        });

        return () => { unsubEmp(); unsubMgr(); };
      }, [user]);

      // URL 파라미터로 empId가 넘어온 경우 세션 자동 연동
      useEffect(() => {
        if (employees.length === 0) return;
        const urlParams = new URLSearchParams(window.location.search);
        const urlEmpId = urlParams.get('empId');
        if (urlEmpId) {
          const matched = employees.find(e => e.id === urlEmpId);
          if (matched) {
            setCurrentEmp(matched);
            sessionStorage.setItem('leave_app_employee_session', JSON.stringify(matched));
          }
        }
      }, [employees]);

      // 실시간 데이터로 현재 사원 정보 동기화
      const myData = useMemo(() => {
        if (!currentEmp) return null;
        const fresh = employees.find(e => e.id === currentEmp.id);
        return fresh || currentEmp;
      }, [employees, currentEmp]);

      // 사원 연차 주기 및 발생 연차 수치 계산
      const stats = useMemo(() => {
        if (!myData || !myData.joinDate) return null;

        const start = new Date(myData.joinDate);
        const effectiveTargetDate = (myData.isResigned && myData.resignationDate) ? myData.resignationDate : today;
        const end = new Date(effectiveTargetDate);
        
        if (end < start) return { years: 0, months: 0, generated: 0, label: '입사 전', periodStartStr: myData.joinDate, periodEndStr: myData.joinDate };

        let months = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
        if (end.getDate() < start.getDate()) months--;
        
        const years = Math.floor(months / 12);
        let generated = 0;
        let label = '';

        let periodStart = new Date(start);
        let periodEnd = new Date(start);

        if (years === 0) {
          generated = Math.min(11, months);
          label = '1년 미만';
          periodStart = new Date(start);
          periodEnd = new Date(start);
          periodEnd.setFullYear(start.getFullYear() + 1);
          periodEnd.setDate(periodEnd.getDate() - 1);
        } else {
          let addDays = Math.floor((years - 1) / 2);
          generated = Math.min(25, 15 + addDays);
          label = `${years + 1}년차`;

          periodStart = new Date(start);
          periodStart.setFullYear(start.getFullYear() + years);
          periodEnd = new Date(start);
          periodEnd.setFullYear(start.getFullYear() + years + 1);
          periodEnd.setDate(periodEnd.getDate() - 1);
        }

        const periodStartStr = periodStart.toISOString().split('T')[0];
        const periodEndStr = periodEnd.toISOString().split('T')[0];

        // 당해 연차 주기 내 사용 연차
        const usedPeriod = (myData.leaveRecords || []).reduce((acc, r) => {
          if (r.type === 'replace_full' || r.type === 'replace_half') return acc;
          if (r.startDate >= periodStartStr && r.startDate <= periodEndStr) {
            return acc + Number(r.days);
          }
          return acc;
        }, 0);

        // 전체 누적 사용 연차
        const usedAllTime = (myData.leaveRecords || []).reduce((acc, r) => {
          if (r.type === 'replace_full' || r.type === 'replace_half') return acc;
          return acc + Number(r.days);
        }, 0);

        const legacyUsed = (myData.usedFullDays || 0) + ((myData.usedHalfDays || 0) * 0.5);
        const usedPeriodTotal = usedPeriod + (years === 0 ? legacyUsed : 0);
        const usedTotalAllTime = usedAllTime + legacyUsed;
        const remaining = Math.max(0, generated - usedPeriodTotal);

        return { years, months, generated, label, periodStartStr, periodEndStr, usedPeriodTotal, usedTotalAllTime, remaining };
      }, [myData, today]);

      // 대체휴무 수치 계산
      const dayoffStats = useMemo(() => {
        if (!myData) return { granted: 0, used: 0, paid: 0, remaining: 0 };
        const records = myData.dayoffRecords || [];
        const granted = records.filter(r => r.type === 'grant').reduce((sum, r) => sum + Number(r.days || 0), 0);
        const used = records.filter(r => r.type === 'use').reduce((sum, r) => sum + Number(r.days || 0), 0);
        const paid = records.filter(r => r.type === 'pay').reduce((sum, r) => sum + Number(r.days || 0), 0);
        const remaining = Math.max(0, granted - used - paid);
        return { granted, used, paid, remaining };
      }, [myData]);

      // 사원/관리자 통합 로그인 핸들러
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');

        const inputIdClean = loginIdInput.trim().toLowerCase();
        const inputPwClean = loginPasswordInput.trim().replace(/-/g, '');

        // 1. 마스터 또는 팀장 계정인 경우 ➔ 관리자 페이지(index.html)로 이동
        const matchedMgr = managers.find(m => m.username.trim().toLowerCase() === inputIdClean && m.password.trim() === loginPasswordInput.trim());
        if (matchedMgr) {
          sessionStorage.setItem('leave_app_manager', JSON.stringify(matchedMgr));
          setLoginIdInput('');
          setLoginPasswordInput('');
          window.location.href = '../index.html';
          return;
        }

        // 2. 일반 사원 계정인 경우 ➔ 마이페이지 연동
        const matchedEmp = employees.find(emp => {
          const expectedId = (emp.loginId || convertHangulToQwerty(emp.name)).toLowerCase();
          const expectedPw = (emp.loginPassword || emp.joinDate.replace(/-/g, '')).replace(/-/g, '');

          const isIdMatch = (inputIdClean === expectedId) || (inputIdClean === emp.name.toLowerCase());
          const isPwMatch = (inputPwClean === expectedPw);

          return isIdMatch && isPwMatch;
        });

        if (matchedEmp) {
          setCurrentEmp(matchedEmp);
          sessionStorage.setItem('leave_app_employee_session', JSON.stringify(matchedEmp));
          setLoginIdInput('');
          setLoginPasswordInput('');
        } else {
          setLoginError('아이디 또는 비밀번호가 올바르지 않습니다.');
        }
      };

      const handleLogout = () => {
        setCurrentEmp(null);
        sessionStorage.removeItem('leave_app_employee_session');
        window.history.replaceState({}, document.title, window.location.pathname);
      };

      const handleViewAttachment = (attachment) => {
        if (!attachment || !attachment.data) return alert('첨부파일 데이터가 없습니다.');
        const win = window.open();
        if (win) {
          win.document.write(`<html><head><title>${attachment.name}</title></head><body style="margin:0;"><iframe src="${attachment.data}" frameborder="0" style="width:100vw; height:100vh;"></iframe></body></html>`);
        } else {
          const a = document.createElement('a');
          a.href = attachment.data;
          a.download = attachment.name;
          a.click();
        }
      };

      const getTypeLabel = (type) => {
        if (type === 'half') return '반차 (0.5일)';
        if (type === 'replace_full') return '연차(대체휴일)';
        if (type === 'replace_half') return '반차(대체휴일)';
        return '연차 (1일)';
      };

      const getTypeStyle = (type) => {
        if (type === 'half') return 'bg-amber-100 text-amber-800';
        if (type === 'replace_full' || type === 'replace_half') return 'bg-purple-100 text-purple-800';
        return 'bg-blue-100 text-blue-800';
      };

      if (isLoading) {
        return (
          <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center space-y-4">
            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
            <p className="text-slate-400 font-medium">내 연차 정보 연결 중...</p>
          </div>
        );
      }

      // 비로그인 상태일 때 [사원 전용 로그인 화면]
      if (!currentEmp || !myData) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-700">
              <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white text-center">
                <div className="bg-white/20 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3 backdrop-blur-sm shadow-inner">
                  <i className="fa-solid fa-id-card text-3xl text-white"></i>
                </div>
                <h2 className="text-2xl font-extrabold tracking-tight">개인 연차 조회 서비스</h2>
              </div>

              <form onSubmit={handleLogin} className="p-6 space-y-4">
                {loginError && (
                  <div className="bg-red-50 border border-red-200 text-red-600 text-xs p-3 rounded-lg flex items-center font-bold">
                    <i className="fa-solid fa-triangle-exclamation mr-2 text-sm"></i>
                    {loginError}
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">사원 아이디</label>
                  <input
                    type="text"
                    required
                    value={loginIdInput}
                    onChange={(e) => setLoginIdInput(e.target.value)}
                    className="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 font-mono"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">비밀번호</label>
                  <input
                    type="password"
                    required
                    value={loginPasswordInput}
                    onChange={(e) => setLoginPasswordInput(e.target.value)}
                    className="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 font-mono"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors text-sm flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-right-to-bracket"></i> 내 연차 조회하기
                </button>
              </form>
            </div>
          </div>
        );
      }

      // 사원 로그인 성공 시 [개인 연차 전용 마이페이지]
      return (
        <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-800">
          <div className="max-w-4xl mx-auto space-y-6">
            
            {/* Header */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div className="flex items-center space-x-4">
                <div className="bg-gradient-to-br from-blue-600 to-indigo-600 p-3.5 rounded-2xl text-white shadow-md">
                  <i className="fa-solid fa-user-check text-2xl"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-2xl font-extrabold text-slate-900">{myData.name} 님의 연차 현황</h1>
                    {myData.isResigned && <span className="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded font-bold">퇴사자</span>}
                  </div>
                  <p className="text-xs text-slate-500 font-medium mt-1">
                    소속: <span className="font-bold text-slate-700">{myData.company || '회사미지정'}</span> / <span className="font-bold text-slate-700">{myData.team || '팀미지정'}</span> | 입사일: <span className="font-bold text-slate-700">{myData.joinDate}</span>
                  </p>
                </div>
              </div>

              <button onClick={handleLogout} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-xs font-bold transition-colors flex items-center gap-1.5 self-end md:self-auto">
                <i className="fa-solid fa-right-from-bracket text-slate-500"></i> 로그아웃
              </button>
            </div>

            {/* 연차 요약 카드 4종 */}
            {stats && (
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div className="flex justify-between items-center text-slate-400 mb-2">
                    <span className="text-xs font-bold text-slate-500">근속 정보</span>
                    <i className="fa-solid fa-briefcase text-blue-500"></i>
                  </div>
                  <div>
                    <div className="text-lg font-black text-slate-800">{stats.label}</div>
                    <div className="text-xs text-slate-500 mt-1">{stats.years}년 {stats.months % 12}개월 근속</div>
                  </div>
                  <div className="text-[10px] text-slate-400 mt-3 pt-2 border-t border-slate-100">
                    주기: {stats.periodStartStr} ~ {stats.periodEndStr}
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div className="flex justify-between items-center text-slate-400 mb-2">
                    <span className="text-xs font-bold text-slate-500">당해 발생 연차</span>
                    <i className="fa-solid fa-calendar-plus text-emerald-500"></i>
                  </div>
                  <div>
                    <div className="text-3xl font-black text-emerald-600">{stats.generated}<span className="text-sm font-bold ml-1 text-slate-600">일</span></div>
                    <div className="text-xs text-slate-400 mt-1">올해 사용할 수 있는 총 연차</div>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div className="flex justify-between items-center text-slate-400 mb-2">
                    <span className="text-xs font-bold text-slate-500">당해 사용 연차</span>
                    <i className="fa-solid fa-calendar-minus text-rose-500"></i>
                  </div>
                  <div>
                    <div className="text-3xl font-black text-rose-600">{stats.usedPeriodTotal}<span className="text-sm font-bold ml-1 text-slate-600">일</span></div>
                    <div className="text-xs text-slate-400 mt-1">전체 누적 사용: {stats.usedTotalAllTime}일</div>
                  </div>
                </div>

                <div className="bg-gradient-to-br from-blue-600 to-indigo-600 p-5 rounded-2xl text-white shadow-md flex flex-col justify-between">
                  <div className="flex justify-between items-center text-blue-200 mb-2">
                    <span className="text-xs font-bold text-blue-100">당해 잔여 연차</span>
                    <i className="fa-solid fa-clock text-amber-300 text-lg"></i>
                  </div>
                  <div>
                    <div className="text-4xl font-black tracking-tight text-white">{stats.remaining}<span className="text-base font-bold ml-1 text-blue-200">일</span></div>
                    <div className="text-xs text-blue-100 mt-1">현재 사용 가능한 남은 연차</div>
                  </div>
                </div>
              </div>
            )}

            {/* 연차 사용 상세 내역 테이블 */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                  <i className="fa-solid fa-list-check text-blue-600"></i>
                  내 연차 상세 사용 내역
                </h3>
                <span className="text-xs bg-white border border-slate-300 px-2.5 py-1 rounded-lg text-slate-600 font-bold">
                  총 {(myData.leaveRecords || []).length}건
                </span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-50 border-b border-slate-200 text-slate-500">
                    <tr>
                      <th className="p-4 font-semibold whitespace-nowrap">사용 기간</th>
                      <th className="p-4 font-semibold text-center whitespace-nowrap">유형</th>
                      <th className="p-4 font-semibold text-center whitespace-nowrap">차감 일수</th>
                      <th className="p-4 font-semibold whitespace-nowrap">사유 / 메모</th>
                      <th className="p-4 font-semibold text-center whitespace-nowrap">첨부 문서</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {(!myData.leaveRecords || myData.leaveRecords.length === 0) ? (
                      <tr>
                        <td colSpan="5" className="p-8 text-center text-slate-400 font-medium">
                          등록된 연차 사용 내역이 없습니다.
                        </td>
                      </tr>
                    ) : (
                      myData.leaveRecords.map((record) => (
                        <tr key={record.id} className="hover:bg-slate-50 transition-colors">
                          <td className="p-4 font-bold text-slate-800">
                            {record.type === 'half' || record.type === 'replace_half' || record.startDate === record.endDate 
                              ? record.startDate 
                              : `${record.startDate} ~ ${record.endDate}`}
                          </td>
                          <td className="p-4 text-center">
                            <span className={`px-2.5 py-1 rounded-md text-xs font-bold ${getTypeStyle(record.type)}`}>
                              {getTypeLabel(record.type)}
                            </span>
                          </td>
                          <td className={`p-4 text-center font-extrabold ${(record.type === 'replace_full' || record.type === 'replace_half') ? 'text-slate-400' : 'text-rose-600'}`}>
                            {(record.type === 'replace_full' || record.type === 'replace_half') ? 0 : record.days}일
                          </td>
                          <td className="p-4 text-slate-600 font-medium">{record.memo || '-'}</td>
                          <td className="p-4 text-center whitespace-nowrap">
                            {record.attachment ? (
                              <button 
                                onClick={() => handleViewAttachment(record.attachment)} 
                                className="inline-flex items-center gap-1.5 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 px-2.5 py-1 rounded-lg text-xs font-bold transition-colors"
                                title={`첨부문서 열기: ${record.attachment.name}`}
                              >
                                <i className="fa-solid fa-file-pdf text-rose-500"></i>
                                <span className="max-w-[120px] truncate">{record.attachment.name}</span>
                              </button>
                            ) : (
                              <span className="text-slate-300 text-xs">-</span>
                            )}
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {/* 대체휴무 요약 카드 & 상세 내역 */}
            <div className="pt-4 border-t border-slate-200 space-y-4">
              <div className="flex items-center justify-between">
                <h2 className="text-lg font-extrabold text-slate-900 flex items-center gap-2">
                  <i className="fa-solid fa-calendar-check text-purple-600"></i>
                  내 대체휴무 현황 (주말/휴일 근무)
                </h2>
                <span className="text-xs bg-purple-100 text-purple-800 px-2.5 py-0.5 rounded-full font-bold">
                  대체휴무 전용
                </span>
              </div>

              {/* 대체휴무 요약 카드 4종 */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div className="flex justify-between items-center text-slate-400 mb-2">
                    <span className="text-xs font-bold text-slate-500">누적 부여</span>
                    <i className="fa-solid fa-plus-circle text-emerald-500"></i>
                  </div>
                  <div>
                    <div className="text-3xl font-black text-emerald-600">{dayoffStats.granted}<span className="text-sm font-bold ml-1 text-slate-600">일</span></div>
                    <div className="text-xs text-slate-400 mt-1">부여받은 총 대체휴무</div>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div className="flex justify-between items-center text-slate-400 mb-2">
                    <span className="text-xs font-bold text-slate-500">휴가 사용</span>
                    <i className="fa-solid fa-plane-departure text-amber-500"></i>
                  </div>
                  <div>
                    <div className="text-3xl font-black text-amber-600">{dayoffStats.used}<span className="text-sm font-bold ml-1 text-slate-600">일</span></div>
                    <div className="text-xs text-slate-400 mt-1">대체휴무로 사용한 일수</div>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div className="flex justify-between items-center text-slate-400 mb-2">
                    <span className="text-xs font-bold text-slate-500">수당 지불</span>
                    <i className="fa-solid fa-hand-holding-dollar text-indigo-500"></i>
                  </div>
                  <div>
                    <div className="text-3xl font-black text-indigo-600">{dayoffStats.paid}<span className="text-sm font-bold ml-1 text-slate-600">일</span></div>
                    <div className="text-xs text-slate-400 mt-1">돈(수당)으로 지급받은 일수</div>
                  </div>
                </div>

                <div className="bg-gradient-to-br from-purple-600 to-indigo-700 p-5 rounded-2xl text-white shadow-md flex flex-col justify-between">
                  <div className="flex justify-between items-center text-purple-200 mb-2">
                    <span className="text-xs font-bold text-purple-100">잔여 대체휴무</span>
                    <i className="fa-solid fa-clock text-amber-300 text-lg"></i>
                  </div>
                  <div>
                    <div className="text-4xl font-black tracking-tight text-white">{dayoffStats.remaining}<span className="text-base font-bold ml-1 text-purple-200">일</span></div>
                    <div className="text-xs text-purple-100 mt-1">부여 - (사용 + 지불)</div>
                  </div>
                </div>
              </div>

              {/* 대체휴무 상세 내역 테이블 */}
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <i className="fa-solid fa-list text-purple-600"></i>
                    내 대체휴무 상세 내역
                  </h3>
                  <span className="text-xs bg-white border border-slate-300 px-2.5 py-1 rounded-lg text-slate-600 font-bold">
                    총 {(myData.dayoffRecords || []).length}건
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-50 border-b border-slate-200 text-slate-500">
                      <tr>
                        <th className="p-4 font-semibold whitespace-nowrap">날짜</th>
                        <th className="p-4 font-semibold text-center whitespace-nowrap">구분</th>
                        <th className="p-4 font-semibold text-center whitespace-nowrap">일수</th>
                        <th className="p-4 font-semibold whitespace-nowrap">사유 / 메모</th>
                        <th className="p-4 font-semibold text-center whitespace-nowrap">첨부 문서</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {(!myData.dayoffRecords || myData.dayoffRecords.length === 0) ? (
                        <tr>
                          <td colSpan="5" className="p-8 text-center text-slate-400 font-medium">
                            등록된 대체휴무 내역이 없습니다.
                          </td>
                        </tr>
                      ) : (
                        myData.dayoffRecords.map((record) => (
                          <tr key={record.id} className="hover:bg-slate-50 transition-colors">
                            <td className="p-4 font-mono font-bold text-slate-800">{record.date}</td>
                            <td className="p-4 text-center">
                              {record.type === 'grant' && <span className="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-md font-bold">부여 (+휴가)</span>}
                              {record.type === 'use' && <span className="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-md font-bold">휴가 사용</span>}
                              {record.type === 'pay' && <span className="bg-indigo-100 text-indigo-800 text-xs px-2.5 py-1 rounded-md font-bold">수당 지불</span>}
                            </td>
                            <td className="p-4 text-center font-extrabold text-slate-800">{record.days}일</td>
                            <td className="p-4 text-slate-600 font-medium">{record.memo || '-'}</td>
                            <td className="p-4 text-center whitespace-nowrap">
                              {record.attachment ? (
                                <button 
                                  onClick={() => handleViewAttachment(record.attachment)} 
                                  className="inline-flex items-center gap-1.5 bg-purple-50 hover:bg-purple-100 border border-purple-200 text-purple-700 px-2.5 py-1 rounded-lg text-xs font-bold transition-colors"
                                  title={`첨부문서 열기: ${record.attachment.name}`}
                                >
                                  <i className="fa-solid fa-file-pdf text-purple-600"></i>
                                  <span className="max-w-[120px] truncate">{record.attachment.name}</span>
                                </button>
                              ) : (
                                <span className="text-slate-300 text-xs">-</span>
                              )}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
