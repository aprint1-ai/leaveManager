<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직원 연차 관리 시스템 (권한 적용버전)</title>
  
  <!-- CSS 및 아이콘 불러오기 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React 및 Babel 불러오기 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 스크롤바 숨기기 등 소소한 디자인 설정 */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background-color: #f9fafb; }
    /* 이름 호버시 밑줄 애니메이션 */
    .name-link:hover { text-decoration: underline; text-decoration-color: #3b82f6; text-underline-offset: 4px; }
    
    /* 🖨️ 인쇄 전용 스타일 (평소엔 숨김, 인쇄시에만 보임) */
    @media print {
      @page { margin: 0; size: A4 portrait; } 
      body { background-color: white; margin: 0; padding: 0; } 
      .print-hide { display: none !important; }
      .print-show { display: block !important; }
      .page-break { 
        page-break-after: always; 
        padding: 15mm; 
        box-sizing: border-box;
      }
      .avoid-break { page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // Firebase 도구 불러오기
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 파이어베이스설정값
    const firebaseConfig = {
      apiKey: "AIzaSyC4ltCdiOULVX_WsNFO1k54t2lTc69JcFI",
      authDomain: "leavemanager-98009.firebaseapp.com",
      projectId: "leavemanager-98009",
      storageBucket: "leavemanager-98009.firebasestorage.app",
      messagingSenderId: "305739969906",
      appId: "1:305739969906:web:93033e6d43ae30fa92d9eb"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      const [user, setUser] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [setupError, setSetupError] = useState(null); 

      // 🔐 권한 및 로그인 관련 상태
      const [managers, setManagers] = useState([]);
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = sessionStorage.getItem('leave_app_manager');
        return saved ? JSON.parse(saved) : null;
      });

      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [showManagerModal, setShowManagerModal] = useState(false);
      const [mgrForm, setMgrForm] = useState({
        id: null, username: '', password: '', name: '', role: 'team_admin', allowedCompany: '전체', allowedTeam: '전체'
      });

      const today = new Date().toISOString().split('T')[0];
      const [targetDate, setTargetDate] = useState(today);

      const [companies, setCompanies] = useState([]);
      const [teams, setTeams] = useState([]);
      const [employees, setEmployees] = useState([]);

      // 모달 및 UI 상태
      const [showAddModal, setShowAddModal] = useState(false);
      const [showAffiliationModal, setShowAffiliationModal] = useState(false);
      const [showBackupModal, setShowBackupModal] = useState(false);
      const [editingEmployee, setEditingEmployee] = useState(null);
      const [historyEmployee, setHistoryEmployee] = useState(null);

      const [newCompany, setNewCompany] = useState('');
      const [newTeam, setNewTeam] = useState('');

      // 검색 및 필터 상태
      const [searchQuery, setSearchQuery] = useState('');
      const [sortConfig, setSortConfig] = useState({ key: 'joinDate', direction: 'asc' });
      const [activeCompany, setActiveCompany] = useState('전체');
      
      const [showCompanyFilterDropdown, setShowCompanyFilterDropdown] = useState(false);
      const [showTeamFilterDropdown, setShowTeamFilterDropdown] = useState(false);
      const [activeTeam, setActiveTeam] = useState('전체');

      const [selectedEmpIds, setSelectedEmpIds] = useState([]);
      const fileInputRef = useRef(null);

      const [formData, setFormData] = useState({ 
        name: '', company: '', team: '', joinDate: '', 
        usedFullDays: 0, usedHalfDays: 0, 
        isResigned: false, resignationDate: '' 
      });

      const [recordForm, setRecordForm] = useState({ id: null, type: 'full', startDate: today, endDate: today, days: 1, memo: '' });

      // 1. 로그인 (익명 인증)
      useEffect(() => {
        signInAnonymously(auth).then((userCredential) => {
          setUser(userCredential.user);
        }).catch((error) => {
          console.error("인증 실패:", error);
          setSetupError(String(error.code || error.message || error)); 
          setIsLoading(false);
        });
      }, []);

      // 2. 데이터 실시간 로드 (설정, 직원, 관리자 계정)
      useEffect(() => {
        if (!user) return;

        // 소속 정보
        const metaRef = doc(db, 'settings', 'metadata');
        const unsubMeta = onSnapshot(metaRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            setCompanies(data.companies || []);
            setTeams(data.teams || []);
          } else {
            setDoc(metaRef, { companies: ['(주)우리회사', '자회사A'], teams: ['경영지원팀', '개발팀', '디자인팀', '영업팀'] });
          }
        });

        // 직원 정보
        const empRef = collection(db, 'employees');
        const unsubEmp = onSnapshot(empRef, (snapshot) => {
          const emps = [];
          snapshot.forEach(d => emps.push({ id: d.id, ...d.data() }));
          setEmployees(emps);
          setIsLoading(false);
        });

        // 🔐 관리자 계정 목록 (초기 마스터 자동 생성을 위함)
        const mgrRef = collection(db, 'managers');
        const unsubMgr = onSnapshot(mgrRef, (snapshot) => {
          const mgrs = [];
          snapshot.forEach(d => mgrs.push({ id: d.id, ...d.data() }));

          if (mgrs.length === 0) {
            // 최초 데이터가 없을 경우 기본 마스터 계정(admin / 1234) 하나 생성
            const defaultMaster = {
              username: 'admin',
              password: '1234',
              name: '총괄 마스터',
              role: 'master',
              allowedCompany: '전체',
              allowedTeam: '전체'
            };
            setDoc(doc(db, 'managers', 'master_default'), defaultMaster);
          }
          setManagers(mgrs);
        });

        return () => { unsubMeta(); unsubEmp(); unsubMgr(); };
      }, [user]);

      // 팀장 로그인 시 해당 권한의 회사/팀으로 고정
      useEffect(() => {
        if (currentUser && currentUser.role === 'team_admin') {
          if (currentUser.allowedCompany && currentUser.allowedCompany !== '전체') {
            setActiveCompany(currentUser.allowedCompany);
          }
          if (currentUser.allowedTeam && currentUser.allowedTeam !== '전체') {
            setActiveTeam(currentUser.allowedTeam);
          }
        }
      }, [currentUser]);

      // 3. 기록 모달 동기화
      useEffect(() => {
        if (historyEmployee) {
          const updated = employees.find(e => e.id === historyEmployee.id);
          if (updated) setHistoryEmployee(updated);
          else setHistoryEmployee(null);
        }
      }, [employees]);

      // 🔐 사용자 로그인 / 로그아웃 처리
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const matched = managers.find(m => m.username.trim() === loginUsername.trim() && m.password.trim() === loginPassword.trim());
        if (matched) {
          setCurrentUser(matched);
          sessionStorage.setItem('leave_app_manager', JSON.stringify(matched));
          setLoginUsername('');
          setLoginPassword('');
        } else {
          setLoginError('아이디 또는 비밀번호가 올바르지 않습니다.');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        sessionStorage.removeItem('leave_app_manager');
      };

      // 🔐 마스터 계정 관리 (계정 추가/수정/삭제)
      const handleSaveManager = async (e) => {
        e.preventDefault();
        if (!mgrForm.username || !mgrForm.password || !mgrForm.name) {
          return alert('아이디, 비밀번호, 성함을 모두 입력해주세요.');
        }

        if (!mgrForm.id) {
          const exists = managers.some(m => m.username.trim() === mgrForm.username.trim());
          if (exists) return alert('이미 존재하는 아이디입니다.');
        }

        const newId = mgrForm.id || Date.now().toString();
        await setDoc(doc(db, 'managers', newId), {
          username: mgrForm.username.trim(),
          password: mgrForm.password.trim(),
          name: mgrForm.name.trim(),
          role: mgrForm.role,
          allowedCompany: mgrForm.allowedCompany || '전체',
          allowedTeam: mgrForm.allowedTeam || '전체'
        }, { merge: true });

        setMgrForm({ id: null, username: '', password: '', name: '', role: 'team_admin', allowedCompany: '전체', allowedTeam: '전체' });
        alert('관리자 계정이 저장되었습니다.');
      };

      const handleDeleteManager = async (id) => {
        if (confirm('이 관리자 계정을 삭제하시겠습니까?')) {
          await deleteDoc(doc(db, 'managers', id));
        }
      };

      // 4. 연차 주기 및 발생 연차 계산 로직
      const calculateStats = (joinDateStr, targetDateStr, isResigned, resDateStr) => {
        if (!joinDateStr) return { years: 0, months: 0, generated: 0, label: '-', periodStartStr: '', periodEndStr: '' };
        
        const start = new Date(joinDateStr);
        const effectiveTargetDate = (isResigned && resDateStr) ? resDateStr : targetDateStr;
        const end = new Date(effectiveTargetDate);
        
        if (end < start) return { years: 0, months: 0, generated: 0, label: '입사 전', periodStartStr: joinDateStr, periodEndStr: joinDateStr };

        let months = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
        if (end.getDate() < start.getDate()) months--;
        
        const years = Math.floor(months / 12);
        let generated = 0;
        let label = '';

        let periodStart = new Date(start);
        let periodEnd = new Date(start);

        if (years === 0) {
          generated = Math.min(11, months);
          label = '1년 미만';
          periodStart = new Date(start);
          periodEnd = new Date(start);
          periodEnd.setFullYear(start.getFullYear() + 1);
          periodEnd.setDate(periodEnd.getDate() - 1);
        } else {
          let addDays = Math.floor((years - 1) / 2);
          generated = Math.min(25, 15 + addDays);
          label = `${years + 1}년차`;

          periodStart = new Date(start);
          periodStart.setFullYear(start.getFullYear() + years);
          periodEnd = new Date(start);
          periodEnd.setFullYear(start.getFullYear() + years + 1);
          periodEnd.setDate(periodEnd.getDate() - 1);
        }

        const periodStartStr = periodStart.toISOString().split('T')[0];
        const periodEndStr = periodEnd.toISOString().split('T')[0];

        return { years, months, generated, label, periodStartStr, periodEndStr };
      };

      useEffect(() => {
        if (!currentUser || currentUser.role === 'master') {
          setActiveTeam('전체');
          setShowTeamFilterDropdown(false);
          setShowCompanyFilterDropdown(false);
        }
      }, [activeCompany]);

      const availableTeams = useMemo(() => {
        const filterSet = new Set();
        employees.forEach(emp => {
          if (activeCompany === '전체' || emp.company === activeCompany) {
            filterSet.add(emp.team || '');
          }
        });
        return Array.from(filterSet).sort();
      }, [employees, activeCompany]);

      // 계정 추가/수정 모달에서 선택한 회사의 팀만 연동하여 추출
      const formAvailableTeams = useMemo(() => {
        if (!mgrForm.allowedCompany || mgrForm.allowedCompany === '전체') {
          return teams;
        }
        const filterSet = new Set();
        employees.forEach(emp => {
          if (emp.company === mgrForm.allowedCompany && emp.team) {
            filterSet.add(emp.team);
          }
        });
        const teamList = Array.from(filterSet).filter(t => t.trim() !== '').sort();
        return teamList.length > 0 ? teamList : teams;
      }, [employees, teams, mgrForm.allowedCompany]);

      const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
        setSortConfig({ key, direction });
      };

      // 🔐 권한에 따른 계산 목록 (팀장일 경우 자기 담당 팀원만 조회)
      const computedEmployees = useMemo(() => {
        let result = employees;

        // 팀장 권한 필터링
        if (currentUser && currentUser.role === 'team_admin') {
          if (currentUser.allowedCompany && currentUser.allowedCompany !== '전체') {
            result = result.filter(emp => emp.company === currentUser.allowedCompany);
          }
          if (currentUser.allowedTeam && currentUser.allowedTeam !== '전체') {
            result = result.filter(emp => (emp.team || '') === currentUser.allowedTeam);
          }
        } else {
          // 마스터 권한인 경우 선택된 탭/드롭다운 필터 적용
          result = result.filter(emp => activeCompany === '전체' || emp.company === activeCompany);
          if (activeTeam !== '전체') {
            result = result.filter(emp => (emp.team || '') === activeTeam);
          }
        }

        if (searchQuery.trim() !== '') {
          result = result.filter(emp => emp.name.includes(searchQuery.trim()));
        }

        result.sort((a, b) => {
          if (a.isResigned && !b.isResigned) return 1;
          if (!a.isResigned && b.isResigned) return -1;

          if (sortConfig.key === 'company') {
            const strA = a.company || '';
            const strB = b.company || '';
            return sortConfig.direction === 'asc' ? strA.localeCompare(strB) : strB.localeCompare(strA);
          } else if (sortConfig.key === 'team') {
            const strA = a.team || '';
            const strB = b.team || '';
            return sortConfig.direction === 'asc' ? strA.localeCompare(strB) : strB.localeCompare(strA);
          } else if (sortConfig.key === 'joinDate') {
            return sortConfig.direction === 'asc'
              ? new Date(a.joinDate) - new Date(b.joinDate)
              : new Date(b.joinDate) - new Date(a.joinDate);
          }
          return 0;
        });

        return result.map(emp => {
          const stats = calculateStats(emp.joinDate, targetDate, emp.isResigned, emp.resignationDate);
          
          const recordsUsedPeriod = (emp.leaveRecords || []).reduce((acc, r) => {
            if (r.type === 'replace_full' || r.type === 'replace_half') return acc;
            if (r.startDate >= stats.periodStartStr && r.startDate <= stats.periodEndStr) {
              return acc + Number(r.days);
            }
            return acc;
          }, 0);

          const recordsUsedAllTime = (emp.leaveRecords || []).reduce((acc, r) => {
            if (r.type === 'replace_full' || r.type === 'replace_half') return acc;
            return acc + Number(r.days);
          }, 0);

          const legacyUsed = (emp.usedFullDays || 0) + ((emp.usedHalfDays || 0) * 0.5);
          
          const usedPeriodTotal = recordsUsedPeriod + (stats.years === 0 ? legacyUsed : 0);
          const usedTotalAllTime = recordsUsedAllTime + legacyUsed;
          
          const remaining = Math.max(0, stats.generated - usedPeriodTotal);
          return { ...emp, stats, legacyUsed, recordsUsedPeriod, recordsUsedAllTime, usedPeriodTotal, usedTotalAllTime, remaining };
        });
      }, [employees, targetDate, sortConfig, activeCompany, activeTeam, searchQuery, currentUser]);

      const handleSelectAll = (e) => {
        if (e.target.checked) setSelectedEmpIds(computedEmployees.map(emp => emp.id));
        else setSelectedEmpIds([]);
      };

      const handleSelectEmp = (id) => {
        if (selectedEmpIds.includes(id)) setSelectedEmpIds(selectedEmpIds.filter(empId => empId !== id));
        else setSelectedEmpIds([...selectedEmpIds, id]);
      };

      const handlePrint = () => {
        if (selectedEmpIds.length === 0) return alert('인쇄할 직원을 먼저 체크박스로 선택해주세요.');
        const selectedNames = computedEmployees.filter(emp => selectedEmpIds.includes(emp.id)).map(emp => emp.name);
        const printTitle = `${selectedNames.join('_')} 연차관리`;
        const originalTitle = document.title; 
        
        document.title = printTitle;
        window.onafterprint = () => {
          document.title = originalTitle;
          window.onafterprint = null; 
        };
        window.print();
      };

      // 백업 및 다운로드
      const handleExportBackup = () => {
        const backupData = {
          version: 'v4_backup',
          exportDate: new Date().toISOString(),
          companies,
          teams,
          employees
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `연차관리_시스템백업_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleExportExcel = () => {
        if (!computedEmployees || computedEmployees.length === 0) {
          return alert('내보낼 직원 데이터가 없습니다.');
        }

        let csvContent = "\uFEFF";
        csvContent += "이름,회사,팀,입사일,근속 상태,당해 발생 연차,당해 사용 연차,당해 잔여 연차,전체 누적 사용일수,퇴사 여부,퇴사일\n";

        computedEmployees.forEach(emp => {
          const isResigned = emp.isResigned ? "퇴사" : "재직";
          const resDate = emp.resignationDate || "";
          csvContent += `"${emp.name}","${emp.company || ''}","${emp.team || ''}","${emp.joinDate}","${emp.stats.label}",${emp.stats.generated},${emp.usedPeriodTotal},${emp.remaining},${emp.usedTotalAllTime},"${isResigned}","${resDate}"\n`;
        });

        csvContent += "\n\n--- 상세 연차 사용 내역 ---\n";
        csvContent += "직원명,회사,팀,사용 시작일,사용 종료일,연차 유형,차감 일수,사유 및 메모\n";

        computedEmployees.forEach(emp => {
          if (emp.leaveRecords && emp.leaveRecords.length > 0) {
            emp.leaveRecords.forEach(r => {
              const typeLabel = getTypeLabel(r.type);
              const days = (r.type === 'replace_full' || r.type === 'replace_half') ? 0 : r.days;
              const memoStr = (r.memo || '').replace(/"/g, '""');
              csvContent += `"${emp.name}","${emp.company || ''}","${emp.team || ''}","${r.startDate}","${r.endDate || r.startDate}","${typeLabel}",${days},"${memoStr}"\n`;
            });
          }
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `직원연차관리현황_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (!data.employees || !Array.isArray(data.employees)) {
              return alert('올바른 연차관리 백업 파일이 아닙니다.');
            }
            if (!confirm(`총 ${data.employees.length}명의 직원 데이터를 파이어베이스에 복구하시겠습니까?`)) return;

            setIsLoading(true);
            if (data.companies || data.teams) {
              await setDoc(doc(db, 'settings', 'metadata'), { 
                companies: data.companies || companies, 
                teams: data.teams || teams 
              }, { merge: true });
            }

            for (const emp of data.employees) {
              if (emp.id) {
                await setDoc(doc(db, 'employees', emp.id), emp);
              }
            }
            alert('백업 데이터 복구가 완료되었습니다.');
            setShowBackupModal(false);
          } catch (err) {
            alert('백업 파일 읽기 실패: ' + err.message);
          } finally {
            setIsLoading(false);
            if (fileInputRef.current) fileInputRef.current.value = '';
          }
        };
        reader.readAsText(file);
      };

      // 마스터 전용: 직원 추가/수정/삭제
      const handleAddSubmit = async (e) => {
        e.preventDefault();
        if (!formData.name || !formData.joinDate) return alert('이름과 입사일을 입력해주세요.');
        const newId = Date.now().toString();
        const newEmployee = { 
          name: formData.name, company: formData.company, team: formData.team, 
          joinDate: formData.joinDate, usedFullDays: 0, usedHalfDays: 0, leaveRecords: [],
          isResigned: formData.isResigned, resignationDate: formData.resignationDate
        };
        await setDoc(doc(db, 'employees', newId), newEmployee);
        setShowAddModal(false);
      };

      const openEditModal = (emp) => {
        if (currentUser?.role === 'team_admin') return; // 팀장 권한 제한

        if (!start || !end) return 0;
        const s = new Date(start);
        const e = new Date(end);
        if (e < s) return 0;
        const diffTime = Math.abs(e - s);
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      };

      const handleRecordTypeChange = (e) => {
        const type = e.target.value;
        setRecordForm(prev => {
          const next = { ...prev, type };
          if (type === 'half') { 
            next.endDate = next.startDate; 
            next.days = 0.5; 
          } else if (type === 'replace_half') {
            next.endDate = next.startDate; 
            next.days = 0;
          } else if (type === 'replace_full') {
            next.days = 0;
          } else { 
            next.days = calculateDaysBetween(next.startDate, next.endDate); 
          }
          return next;
        });
      };

      const handleRecordDateChange = (field, value) => {
        setRecordForm(prev => {
          const next = { ...prev, [field]: value };
          if (next.type === 'half') {
            if (field === 'startDate') next.endDate = value;
            next.days = 0.5;
          } else if (next.type === 'replace_half') {
            if (field === 'startDate') next.endDate = value;
            next.days = 0;
          } else if (next.type === 'replace_full') {
            if (field === 'startDate' && new Date(next.endDate) < new Date(value)) next.endDate = value;
            next.days = 0;
          } else {
            if (field === 'startDate' && new Date(next.endDate) < new Date(value)) next.endDate = value;

        const latestEmp = employees.find(e => e.id === historyEmployee.id) || historyEmployee;
        let updatedRecords = [...(latestEmp.leaveRecords || [])];

        if (recordForm.id) {

           updatedRecords.push({ ...recordForm, id: Date.now().toString() });

                        </h2>
                        <p className="text-xs text-gray-400 mt-1">입사일: {historyEmployee.joinDate}</p>
                      </div>
                      <button onClick={() => setHistoryEmployee(null)} className="text-gray-400 hover:text-white text-2xl"><i className="fa-solid fa-xmark"></i></button>
                    </div>
                    
                    <div className="p-6 overflow-y-auto flex-1 bg-gray-50 space-y-6">
                      {/* 신규 기록 추가 폼 (마스터 권한일 때만 보임) */}
                      {currentUser?.role === 'master' && (
                        <div className="bg-white p-5 rounded-xl border border-blue-200 shadow-sm">
                          <h3 className="font-bold text-blue-800 mb-4 flex items-center">
                            <i className="fa-solid fa-plus-circle mr-2"></i> {recordForm.id ? '기록 수정하기' : '새 연차 기록 추가'}
                          </h3>
                          <form onSubmit={handleSaveRecord} className="flex flex-wrap gap-4 items-end">
                            <div className="flex-1 min-w-[120px]">
                              <label className="block text-xs font-semibold text-gray-600 mb-1">유형</label>
                              <select value={recordForm.type} onChange={handleRecordTypeChange} className="w-full p-2 border border-gray-300 rounded-lg outline-none bg-white">
                                <option value="full">연차</option>
                                <option value="half">반차 (0.5일)</option>
                                <option value="replace_full">연차(대체휴일)</option>
                                <option value="replace_half">반차(대체휴일)</option>
                              </select>
                            </div>
                            <div className="flex-1 min-w-[140px]">
                              <label className="block text-xs font-semibold text-gray-600 mb-1">시작일</label>
                              <input type="date" required value={recordForm.startDate} onChange={(e) => handleRecordDateChange('startDate', e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg outline-none" />
                            </div>
                            {(recordForm.type === 'full' || recordForm.type === 'replace_full') && (
                              <div className="flex-1 min-w-[140px]">
                                <label className="block text-xs font-semibold text-gray-600 mb-1">종료일</label>
                                <input type="date" required value={recordForm.endDate} min={recordForm.startDate} onChange={(e) => handleRecordDateChange('endDate', e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg outline-none" />
                              </div>
                            )}
                            <div className="w-[80px]">
                              <label className="block text-xs font-semibold text-gray-600 mb-1">차감 일수</label>
                              <input 
                                type="number" step="0.5" required 
                                value={recordForm.days} 
                                onChange={(e) => setRecordForm({...recordForm, days: (recordForm.type === 'replace_full' || recordForm.type === 'replace_half') ? 0 : Number(e.target.value)})} 
                                disabled={recordForm.type === 'replace_full' || recordForm.type === 'replace_half'}
                                className={`w-full p-2 border border-gray-300 rounded-lg outline-none text-center font-bold ${recordForm.type === 'replace_full' || recordForm.type === 'replace_half' ? 'bg-gray-200 text-gray-500' : 'bg-gray-50'}`} 
                              />
                            </div>
                            <div className="flex-[2] min-w-[200px]">
                              <label className="block text-xs font-semibold text-gray-600 mb-1">사유 (선택)</label>
                              <input type="text" value={recordForm.memo} onChange={(e) => setRecordForm({...recordForm, memo: e.target.value})} placeholder="여름휴가, 개인사정 등" className="w-full p-2 border border-gray-300 rounded-lg outline-none" />
                            </div>
                            <div className="flex gap-2">
                              {recordForm.id && (
                                <button type="button" onClick={() => setRecordForm({ id: null, type: 'full', startDate: today, endDate: today, days: 1, memo: '' })} className="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300">취소</button>
                              )}
                              <button type="submit" className={`px-5 py-2 text-white rounded-lg font-bold shadow-sm ${recordForm.id ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                {recordForm.id ? '수정' : '추가'}
                              </button>
                            </div>
                          </form>
                        </div>
                      )}

                      {/* 기록 리스트 */}
                      <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                        <div className="bg-gray-100 p-3 border-b border-gray-200 flex justify-between items-center">
                          <span className="font-bold text-gray-700 text-sm">상세 내역 리스트</span>
                          <span className="text-xs bg-white border border-gray-300 px-2 py-1 rounded text-gray-600 font-semibold">총 {(historyEmployee.leaveRecords || []).length}건</span>
                        </div>
                        <div className="overflow-x-auto max-h-[300px] overflow-y-auto">
                          <table className="w-full text-left text-sm">
                            <thead className="bg-white sticky top-0 border-b border-gray-100 z-10 shadow-sm">
                              <tr className="text-gray-500">
                                <th className="p-3 font-semibold whitespace-nowrap">사용 기간</th>
                                <th className="p-3 font-semibold text-center whitespace-nowrap">유형</th>
                                <th className="p-3 font-semibold text-center whitespace-nowrap">차감 일수</th>
                                <th className="p-3 font-semibold whitespace-nowrap">사유</th>
                                {currentUser?.role === 'master' && (
                                  <th className="p-3 font-semibold text-center whitespace-nowrap">관리</th>
                                )}
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                              {(!historyEmployee.leaveRecords || historyEmployee.leaveRecords.length === 0) ? (
                                <tr><td colSpan={currentUser?.role === 'master' ? 5 : 4} className="p-6 text-center text-gray-400">등록된 상세 기록이 없습니다.</td></tr>
                              ) : (
                                historyEmployee.leaveRecords.map((record) => (
                                  <tr key={record.id} className="hover:bg-gray-50 transition-colors">
                                    <td className="p-3 font-medium text-gray-800">
                                      {record.type === 'half' || record.type === 'replace_half' || record.startDate === record.endDate 
                                        ? record.startDate 
                                        : `${record.startDate} ~ ${record.endDate}`}
                                    </td>
                                    <td className="p-3 text-center">
                                      <span className={`px-2 py-0.5 rounded text-xs font-bold ${getTypeStyle(record.type)}`}>
                                        {getTypeLabel(record.type)}
                                      </span>
                                    </td>
                                    <td className={`p-3 text-center font-bold ${(record.type === 'replace_full' || record.type === 'replace_half') ? 'text-gray-400' : 'text-red-500'}`}>
                                      {(record.type === 'replace_full' || record.type === 'replace_half') ? 0 : record.days}일
                                    </td>
                                    <td className="p-3 text-gray-600">{record.memo || '-'}</td>
                                    
                                    {currentUser?.role === 'master' && (
                                      <td className="p-3 text-center whitespace-nowrap">
                                        <button onClick={() => handleEditRecord(record)} className="p-1.5 text-gray-400 hover:text-green-600 mx-1" title="수정"><i className="fa-solid fa-pen text-xs"></i></button>
                                        <button onClick={() => handleDeleteRecord(record.id)} className="p-1.5 text-gray-400 hover:text-red-600 mx-1" title="삭제"><i className="fa-solid fa-trash text-xs"></i></button>
                                      </td>
                                    )}
                                  </tr>
                                ))
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* 소속 관리 모달 (마스터 전용) */}
              {showAffiliationModal && currentUser?.role === 'master' && (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                  <div className="bg-white rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
                    <div className="bg-gray-800 p-4 text-white flex justify-between items-center">
                      <h2 className="font-bold text-lg flex items-center"><i className="fa-regular fa-building mr-2"></i> 소속 목록 편집</h2>
                      <button onClick={() => setShowAffiliationModal(false)} className="text-gray-400 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    <div className="p-6 space-y-6">
                      <div className="space-y-3">
                        <h3 className="font-semibold text-gray-800 border-b pb-2">회사명 관리</h3>
                        <div className="flex space-x-2">
                          <input type="text" value={newCompany} onChange={(e) => setNewCompany(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAddCompany()} placeholder="새로운 회사명 입력" className="flex-1 p-2.5 border border-gray-300 rounded-lg text-sm outline-none" />
                          <button type="button" onClick={handleAddCompany} className="bg-blue-600 hover:bg-blue-700 text-white px-4 rounded-lg flex items-center"><i className="fa-solid fa-plus mr-1"></i> 추가</button>
                        </div>
                        <div className="flex flex-wrap gap-2 mt-2 max-h-32 overflow-y-auto">
                          {companies.map((c, i) => (
                            <div key={i} className="bg-gray-100 border border-gray-200 rounded-full px-3 py-1 flex items-center space-x-2 text-sm">
                              <span className="text-gray-700">{c}</span>
                              <button onClick={() => handleRemoveCompany(c)} className="text-gray-400 hover:text-red-500"><i className="fa-solid fa-xmark"></i></button>
                            </div>
                          ))}
                        </div>
                      </div>
                      <div className="space-y-3">
                        <h3 className="font-semibold text-gray-800 border-b pb-2 mt-4">팀 이름 관리</h3>
                        <div className="flex space-x-2">
                          <input type="text" value={newTeam} onChange={(e) => setNewTeam(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAddTeam()} placeholder="새로운 팀 이름 입력" className="flex-1 p-2.5 border border-gray-300 rounded-lg text-sm outline-none" />
                          <button type="button" onClick={handleAddTeam} className="bg-blue-600 hover:bg-blue-700 text-white px-4 rounded-lg flex items-center"><i className="fa-solid fa-plus mr-1"></i> 추가</button>
                        </div>
                        <div className="flex flex-wrap gap-2 mt-2 max-h-32 overflow-y-auto">
                          {teams.map((t, i) => (
                            <div key={i} className="bg-gray-100 border border-gray-200 rounded-full px-3 py-1 flex items-center space-x-2 text-sm">
                              <span className="text-gray-700">{t}</span>
                              <button onClick={() => handleRemoveTeam(t)} className="text-gray-400 hover:text-red-500"><i className="fa-solid fa-xmark"></i></button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                    <div className="bg-gray-50 p-4 border-t border-gray-200 flex justify-end">
                      <button onClick={() => setShowAffiliationModal(false)} className="px-6 py-2.5 bg-gray-800 text-white rounded-lg font-semibold hover:bg-gray-900">닫기</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
